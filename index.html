<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Gestão de Obras & RDO</title>
    <!-- Supabase JS Client v2 -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --danger: #ef4444;
            --danger-hover: #dc2626;
            --success: #10b981;
            --success-hover: #059669;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* TELA DE LOGIN */
        #login-screen {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: var(--bg);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }

        .login-card {
            background: var(--card-bg);
            padding: 2.5rem;
            border-radius: 12px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
        }

        .login-card h2 {
            margin-bottom: 1.5rem;
            text-align: center;
            color: var(--primary);
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 0.875rem;
            font-weight: 600;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-group input:focus, .form-group select:focus {
            border-color: var(--primary);
        }

        button {
            cursor: pointer;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            transition: background-color 0.2s;
        }

        .btn-primary {
            background-color: var(--primary);
            color: white;
            padding: 0.75rem 1.25rem;
            width: 100%;
        }

        .btn-primary:hover { background-color: var(--primary-hover); }

        .btn-success {
            background-color: var(--success);
            color: white;
            padding: 0.5rem 1rem;
        }

        .btn-success:hover { background-color: var(--success-hover); }

        .btn-danger {
            background-color: var(--danger);
            color: white;
            padding: 0.5rem 1rem;
        }

        .btn-danger:hover { background-color: var(--danger-hover); }

        /* PAINEL PRINCIPAL */
        #app-screen {
            display: none;
            width: 100%;
            height: 100%;
            flex-direction: column;
        }

        header {
            background-color: var(--card-bg);
            border-bottom: 1px solid var(--border);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .container {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        sidebar {
            width: 320px;
            background-color: var(--card-bg);
            border-right: 1px solid var(--border);
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            overflow-y: auto;
        }

        main {
            flex: 1;
            padding: 2rem;
            overflow-y: auto;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        /* TABELAS */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1rem;
        }

        th, td {
            padding: 0.75rem 1rem;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }

        th {
            background-color: var(--bg);
            font-weight: 600;
            color: var(--text-muted);
        }

        /* MODAIS */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.5);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal {
            background: var(--card-bg);
            border-radius: 8px;
            padding: 2rem;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 0.75rem;
            margin-top: 1.5rem;
        }

        .btn-secondary {
            background-color: var(--border);
            color: var(--text);
            padding: 0.5rem 1rem;
        }
    </style>
</head>
<body>

    <!-- 1. TELA DE LOGIN -->
    <div id="login-screen">
        <div class="login-card">
            <h2>Acesso ao Sistema</h2>
            <form id="formLogin" onsubmit="realizarLogin(event)">
                <div class="form-group">
                    <label for="loginEmail">E-mail</label>
                    <input type="email" id="loginEmail" required placeholder="seu@email.com">
                </div>
                <div class="form-group">
                    <label for="loginSenha">Senha</label>
                    <input type="password" id="loginSenha" required placeholder="••••••••">
                </div>
                <button type="submit" class="btn-primary">Entrar</button>
            </form>
        </div>
    </div>

    <!-- 2. PAINEL PRINCIPAL -->
    <div id="app-screen">
        <header>
            <h1>Gestão de Obras & RDO</h1>
            <div class="user-info">
                <span id="userDisplayEmail" style="font-weight: 600;"></span>
                <button class="btn-danger" style="padding: 0.4rem 0.8rem; font-size: 0.875rem;" onclick="realizarLogout()">Sair</button>
            </div>
        </header>

        <div class="container">
            <!-- BARRA LATERAL: SELEÇÃO E AÇÕES DE OBRAS -->
            <sidebar>
                <div>
                    <h3>Obra Ativa</h3>
                    <div class="form-group" style="margin-top: 0.5rem;">
                        <select id="selectObraAtiva" onchange="selecionarObraAtiva(this.value)">
                            <!-- Opções carregadas via JS -->
                        </select>
                    </div>
                </div>

                <div id="secaoAcoesObra">
                    <button class="btn-primary" onclick="abrirModalObra()" style="margin-bottom: 0.5rem;">+ Nova Obra</button>
                    <button class="btn-secondary" style="width: 100%; margin-bottom: 0.5rem;" onclick="arquivarObraAtual()">Arquivar Obra Ativa</button>
                    <button class="btn-danger" style="width: 100%; font-size: 0.85em;" onclick="excluirObraAtiva()">Excluir Obra Ativa</button>
                </div>

                <div id="secaoAdminUsuarios" style="border-top: 1px solid var(--border); padding-top: 1.5rem; display: none;">
                    <h3>Administração</h3>
                    <button class="btn-primary" style="margin-top: 0.5rem; background-color: #475569;" onclick="abrirModalUsuario()">+ Cadastrar Usuário</button>
                </div>
            </sidebar>

            <!-- CONTEÚDO PRINCIPAL -->
            <main>
                <!-- CARD DE OBRAS ARQUIVADAS -->
                <div class="card">
                    <div class="card-header">
                        <h2>Obras Arquivadas</h2>
                    </div>
                    <table>
                        <thead>
                            <tr>
                                <th>Nome da Obra</th>
                                <th>Ações</th>
                            </tr>
                        </thead>
                        <tbody id="tabelaObrasArquivadas">
                            <!-- Preenchido dinamicamente -->
                        </tbody>
                    </table>
                </div>

                <!-- CARD DE USUÁRIOS DO SISTEMA (visível para admins) -->
                <div class="card" id="cardGerenciamentoUsuarios" style="display: none;">
                    <div class="card-header">
                        <h2>Usuários Cadastrados</h2>
                    </div>
                    <table>
                        <thead>
                            <tr>
                                <th>E-mail</th>
                               <th>Função</th>
                                <th>UUID</th>
                                <th style="text-align: center;">Ações</th>
                            </tr>
                        </thead>
                        <tbody id="tabelaUsuariosCorpo">
                            <!-- Preenchido dinamicamente -->
                        </tbody>
                    </table>
                </div>
            </main>
        </div>
    </div>

    <!-- MODAL: NOVA OBRA -->
    <div class="modal-overlay" id="modal-obra-overlay">
        <div class="modal">
            <h2>Cadastrar Nova Obra</h2>
            <div class="form-group" style="margin-top: 1rem;">
                <label for="nomeObraInput">Nome da Obra</label>
                <input type="text" id="nomeObraInput" placeholder="Ex: Residencial Parque das Flores">
            </div>
            <div class="modal-actions">
                <button class="btn-secondary" onclick="fecharModalObra()">Cancelar</button>
                <button class="btn-primary" style="width: auto;" onclick="salvarNovaObra()">Salvar</button>
            </div>
        </div>
    </div>

    <!-- MODAL: NOVO USUÁRIO -->
    <div class="modal-overlay" id="modal-usuario-overlay">
        <div class="modal">
            <h2>Cadastrar Novo Usuário</h2>
            <div class="form-group" style="margin-top: 1rem;">
                <label for="novoUserEmail">E-mail</label>
                <input type="email" id="novoUserEmail" placeholder="usuario@empresa.com">
            </div>
            <div class="form-group">
                <label for="novoUserSenha">Senha Temporária</label>
                <input type="password" id="novoUserSenha" value="123456">
            </div>
            <div class="form-group">
                <label for="novoUserRole">Nível de Acesso</label>
                <select id="novoUserRole">
                    <option value="operador">Operador (Leitura/Escrita básica)</option>
                    <option value="admin">Administrador (Acesso total)</option>
                </select>
            </div>
            <div class="modal-actions">
                <button class="btn-secondary" onclick="fecharModalUsuario()">Cancelar</button>
                <button class="btn-primary" style="width: auto;" onclick="cadastrarUsuario()">Criar Usuário</button>
            </div>
        </div>
    </div>

    <!-- SCRIPT DE LÓGICA E INTEGRAÇÃO -->
    <script>
        // CONFIGURAÇÃO DO SUPABASE
        const SUPABASE_URL = "HTTPS://SUA-URL-AQUI.SUPABASE.CO"; // Substitua pela URL do seu projeto
        const SUPABASE_ANON_KEY = "SUA-CHAVE-ANON-AQUI";        // Substitua pela Chave Anon pública
        const EMAIL_SUPERADMIN = "admin@empresa.com";            // E-mail master do sistema

        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // ESTADO GLOBAL DA APLICAÇÃO
        let usuarioAtual = null;
        let perfilAtual = null;
        let listaObras = [];
        let obraAtivaId = null;

        // INICIALIZAÇÃO E CHECAGEM DE SESSÃO
        window.addEventListener('DOMContentLoaded', async () => {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session) {
                await inicializarAplicacao(session.user);
            } else {
                mostrarTelaLogin();
            }
        });

        async function realizarLogin(e) {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginSenha').value;

            const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });

            if (error) {
                alert("Falha na autenticação: " + error.message);
                return;
            }

            await inicializarAplicacao(data.user);
        }

        async function realizarLogout() {
            await supabaseClient.auth.signOut();
            usuarioAtual = null;
            perfilAtual = null;
            obraAtivaId = null;
            mostrarTelaLogin();
        }

        function mostrarTelaLogin() {
            document.getElementById('login-screen').style.display = 'flex';
            document.getElementById('app-screen').style.display = 'none';
        }

        async function inicializarAplicacao(user) {
            usuarioAtual = user;
            document.getElementById('userDisplayEmail').innerText = user.email;

            // Carrega perfil do usuário logado
            const { data: perfil, error } = await supabaseClient
                .from('perfis')
                .select('*')
                .eq('id', user.id)
                .single();

            if (error && error.code !== 'PGRST116') {
                console.error("Erro ao carregar perfil:", error.message);
            }

            perfilAtual = perfil || { role: 'operador' };

            // Ajusta visibilidade de recursos administrativos
            const isAdmin = perfilAtual.role === 'admin' || user.email === EMAIL_SUPERADMIN;
            document.getElementById('secaoAdminUsuarios').style.display = isAdmin ? 'block' : 'none';
            document.getElementById('cardGerenciamentoUsuarios').style.display = isAdmin ? 'block' : 'none';

            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('app-screen').style.display = 'flex';

            await carregarObras();

            if (isAdmin) {
                await carregarUsuarios();
            }
        }

        // LÓGICA DE GERENCIAMENTO DE OBRAS
        async function carregarObras() {
            const { data, error } = await supabaseClient.from('obras').select('*').order('created_at', { ascending: false });

            if (error) return alert("Erro ao carregar obras: " + error.message);

            listaObras = data || [];
            atualizarSelectObrasAtivas();
            atualizarTabelaArquivadas();
        }

        function atualizarSelectObrasAtivas() {
            const select = document.getElementById('selectObraAtiva');
            select.innerHTML = '';

            const obrasAtivas = listaObras.filter(o => o.status === 'ativa');

            if (obrasAtivas.length === 0) {
                select.innerHTML = '<option value="">Nenhuma obra ativa</option>';
                obraAtivaId = null;
                return;
            }

            obrasAtivas.forEach(obra => {
                const opt = document.createElement('option');
                opt.value = obra.id;
                opt.textContent = obra.nome;
                select.appendChild(opt);
            });

            // Mantém a obra selecionada anteriormente ou seleciona a primeira
            if (!obraAtivaId || !obrasAtivas.some(o => o.id === obraAtivaId)) {
                obraAtivaId = obrasAtivas[0].id;
            }
            select.value = obraAtivaId;
        }

        function selecionarObraAtiva(id) {
            obraAtivaId = id;
        }

        function abrirModalObra() {
            document.getElementById('modal-obra-overlay').style.display = 'flex';
            document.getElementById('nomeObraInput').value = '';
        }

        function fecharModalObra() {
            document.getElementById('modal-obra-overlay').style.display = 'none';
        }

        async function salvarNovaObra() {
            const nome = document.getElementById('nomeObraInput').value.trim();
            if (!nome) return alert("Digite o nome da obra.");

            const { data, error } = await supabaseClient
                .from('obras')
                .insert([{ nome, status: 'ativa', criado_por: usuarioAtual.id }])
                .select();

            if (error) return alert("Erro ao criar obra: " + error.message);

            if (data && data.length > 0) {
                obraAtivaId = data[0].id;
            }

            fecharModalObra();
            await carregarObras();
        }

        async function arquivarObraAtual() {
            if (!obraAtivaId) return alert("Nenhuma obra ativa selecionada.");
            if (!confirm("Deseja realmente arquivar esta obra? Ela será movida para a lista de arquivadas.")) return;

            const { error } = await supabaseClient.from('obras').update({ status: 'arquivada' }).eq('id', obraAtivaId);
            if (error) return alert("Erro ao arquivar obra: " + error.message);

            obraAtivaId = null;
            await carregarObras();
        }

        async function desarquivarObra(id) {
            const { error } = await supabaseClient.from('obras').update({ status: 'ativa' }).eq('id', id);
            if (error) return alert("Erro ao desarquivar obra: " + error.message);

            obraAtivaId = id;
            await carregarObras();
        }

        async function excluirObraAtiva() {
            if (!obraAtivaId) return alert("Nenhuma obra ativa selecionada.");
            if (!confirm("ATENÇÃO: A exclusão é permanente! Todos os RDOs e registros de estoque desta obra serão perdidos. Deseja continuar?")) return;

            const { error } = await supabaseClient.from('obras').delete().eq('id', obraAtivaId);
            if (error) return alert("Erro ao excluir obra: " + error.message);

            obraAtivaId = null;
            await carregarObras();
        }

        function atualizarTabelaArquivadas() {
            const tbody = document.getElementById('tabelaObrasArquivadas');
            tbody.innerHTML = '';

            const obrasArquivadas = listaObras.filter(o => o.status === 'arquivada');

            if (obrasArquivadas.length === 0) {
                tbody.innerHTML = '<tr><td colspan="2" style="text-align: center; color: #64748b;">Nenhuma obra arquivada.</td></tr>';
                return;
            }

            obrasArquivadas.forEach(obra => {
                tbody.innerHTML += `
                    <tr>
                        <td>${obra.nome}</td>
                        <td>
                            <button class="btn-success" style="padding: 4px 8px; font-size: 0.85em;" onclick="desarquivarObra('${obra.id}')">Desarquivar 📂</button>
                        </td>
                    </tr>
                `;
            });
        }

        // LÓGICA DE GERENCIAMENTO DE USUÁRIOS
        function abrirModalUsuario() {
            document.getElementById('modal-usuario-overlay').style.display = 'flex';
            document.getElementById('novoUserEmail').value = '';
            document.getElementById('novoUserSenha').value = '123456';
        }

        function fecharModalUsuario() {
            document.getElementById('modal-usuario-overlay').style.display = 'none';
        }

        async function cadastrarUsuario() {
            const email = document.getElementById('novoUserEmail').value.trim();
            const password = document.getElementById('novoUserSenha').value;
            const role = document.getElementById('novoUserRole').value;

            if (!email || !password) return alert("Preencha o e-mail e a senha temporária.");

            // Cadastra o usuário no Supabase Auth
            const { data, error } = await supabaseClient.auth.signUp({ email, password });

            if (error) return alert("Erro ao cadastrar usuário no Auth: " + error.message);

            if (data.user) {
                // Insere o perfil na tabela 'perfis'
                const { error: profileError } = await supabaseClient.from('perfis').insert([{
                    id: data.user.id,
                    email: email,
                    role: role,
                    senha_temporaria: true
                }]);

                if (profileError) {
                    alert("Usuário criado, mas houve erro ao salvar o perfil: " + profileError.message);
                } else {
                    alert("Usuário cadastrado com sucesso!");
                    fecharModalUsuario();
                    await carregarUsuarios();
                }
            }
        }

        async function carregarUsuarios() {
            const { data, error } = await supabaseClient.from('perfis').select('*');
            if (error) return alert("Erro ao carregar usuários: " + error.message);

            const tbody = document.getElementById('tabelaUsuariosCorpo');
            tbody.innerHTML = '';

            (data || []).forEach(u => {
                const isSuperAdmin = u.email === EMAIL_SUPERADMIN;
                const roleBadge = u.role === 'admin' ? '⭐ Administrador' : '👷 Operador';

                tbody.innerHTML += `
                    <tr>
                        <td>${u.email} ${isSuperAdmin ? '<b>(Principal)</b>' : ''}</td>
                        <td>${roleBadge}</td>
                        <td style="font-family: monospace; font-size: 0.85em;">${u.id}</td>
                        <td style="text-align: center;">
                            ${!isSuperAdmin ? `<button class="btn-danger" style="padding: 4px 8px; font-size: 0.8em;" onclick="excluirUsuario('${u.id}')">Excluir</button>` : '<small style="color: #64748b;">Protegido</small>'}
                        </td>
                    </tr>
                `;
            });
        }

        async function excluirUsuario(userId) {
            if (!confirm("Deseja realmente remover a permissão de acesso deste usuário?")) return;

            const { error } = await supabaseClient.from('perfis').delete().eq('id', userId);
            if (error) return alert("Erro ao remover usuário: " + error.message);

            alert("Perfil do usuário removido do sistema com sucesso.");
            await carregarUsuarios();
        }
    </script>
</body>
</html>
